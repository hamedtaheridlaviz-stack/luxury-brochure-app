<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luminary Brochures</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="app">
<header class="header"><div class="logo-mark">◇</div><div><h1>Luminary</h1><p>Luxury Property Brochures</p></div></header>
<section class="card import-card">
<label for="sourceUrl">Listing URL</label>
<input id="sourceUrl" type="url" placeholder="Paste Property Finder or Bayut URL" autocomplete="off" />
<button id="importBtn" type="button">Import Listing</button>
<p id="status" class="status"></p>
</section>
<section class="card form-card">
<label for="title">Property Title</label><input id="title" />
<label for="price">Price</label><input id="price" />
<label for="propertyType">Type</label><input id="propertyType" />
<label for="location">Location</label><input id="location" />
<div class="grid"><div><label for="beds">Beds</label><input id="beds" /></div><div><label for="baths">Baths</label><input id="baths" /></div><div><label for="area">Area</label><input id="area" /></div></div>
<label for="description">Description</label><textarea id="description" rows="7"></textarea>
<label for="features">Features</label><textarea id="features" rows="5"></textarea>
<label for="photosInput">Upload / Replace Photos</label><input id="photosInput" type="file" accept="image/*" multiple />
<div id="photoPreview" class="photo-grid"></div>
<label for="company">Company</label><input id="company" value="Betterhomes" />
<label for="agent">Agent</label><input id="agent" value="Hamed Taheri Dlavi" />
<label for="phone">Phone</label><input id="phone" value="0595171746" />
<label for="email">Email</label><input id="email" value="Hamed.taheri@bhomes.com" />
<button id="previewBtn" type="button">Create Brochure Preview</button>
<button id="printBtn" type="button" class="secondary">Export / Save PDF</button>
</section>
<section id="brochure" class="brochure">
<div class="page cover"><div class="hero placeholder">PROPERTY PHOTO</div><div class="brand-badge outCompany">Betterhomes</div><div class="cover-strip"><h2 class="outTitle">Property Title</h2><p class="outSummary">Price - Type - Location</p></div></div>
<div class="page info"><h2 class="outTitle">Property Title</h2><p class="outSummary"></p><p class="outStats"></p><p class="outDescription"></p><h3>Key Features</h3><ul class="outFeatures"></ul><div class="contact"><strong class="outAgent">Hamed Taheri Dlavi</strong><br><span class="outContact"></span></div></div>
<div class="page collage"><div class="photo p1 placeholder">PHOTO</div><div class="photo p2 placeholder">PHOTO</div><div class="photo p3 placeholder">PHOTO</div><div class="photo p4 placeholder">PHOTO</div></div>
</section>
</main>
<script src="script.js?v=final4"></script>
</body>
</html>
