<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luminary Brochures</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="app">
<header><div class="logo">◇</div><div><h1>Luminary</h1><p>Luxury Property Brochures</p></div></header>

<section class="card">
<label>Listing URL</label>
<input id="sourceUrl" placeholder="Paste Property Finder or Bayut URL" />
<button onclick="importListing()" id="importBtn">Import Listing</button>
<p id="status"></p>
</section>

<section class="card">
<label>Property Title</label><input id="title" />
<label>Price</label><input id="price" />
<label>Type</label><input id="propertyType" />
<label>Location</label><input id="location" />
<div class="grid"><div><label>Beds</label><input id="beds" /></div><div><label>Baths</label><input id="baths" /></div><div><label>Area</label><input id="area" /></div></div>
<label>Description</label><textarea id="description" rows="6"></textarea>
<label>Features / Amenities</label><textarea id="features" rows="5"></textarea>
<label>Company</label><input id="company" value="Betterhomes" />
<label>Agent</label><input id="agent" value="Hamed Taheri Dlavi" />
<label>Phone</label><input id="phone" value="0595171746" />
<label>Email</label><input id="email" value="Hamed.taheri@bhomes.com" />
<input type="file" id="photosInput" multiple accept="image/*" />
<div id="photoPreview" class="photoGrid"></div>
<button onclick="buildBrochure()">Create Brochure Preview</button>
<button onclick="window.print()" class="secondary">Export / Save PDF</button>
</section>

<section id="brochure" class="brochure">
<div class="page cover"><div class="hero placeholder">PROPERTY PHOTO</div><div class="brandBadge outCompany">Betterhomes</div><div class="strip"><h2 class="outTitle">Property Title</h2><p class="outSummary">Price - Type</p></div></div>
<div class="page info"><h2 class="outTitle">Property Title</h2><p class="outSummary"></p><p class="outDescription"></p><h3>Key Features</h3><ul class="outFeatures"></ul><div class="contact"><strong class="outAgent"></strong><br><span class="outContact"></span></div></div>
<div class="page collage"><div class="photo p1 placeholder">PHOTO</div><div class="photo p2 placeholder">PHOTO</div><div class="photo p3 placeholder">PHOTO</div><div class="photo p4 placeholder">PHOTO</div></div>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
